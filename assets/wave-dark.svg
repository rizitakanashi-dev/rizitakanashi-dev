<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="36" viewBox="0 0 840 36" role="img" aria-label="divider"><title>divider</title><style>text{font-family:G,'Google Sans','Segoe UI',Roboto,sans-serif;font-variation-settings:'ROND' 100}
.up{animation:up .75s cubic-bezier(.16,1,.3,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
.fade{animation:fade .8s ease both}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}
.spin-r{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite reverse}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 6s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 8s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,0,0,1) both}
.wave{animation:wave 2.6s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.12);opacity:.78}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-48px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="4" y="8" width="832" height="20" rx="6" fill="#000000"/><rect x="2" y="6" width="832" height="20" rx="6" fill="rgba(255, 255, 255, 0.07)" stroke="#F4F0EA" stroke-width="2"/><clipPath id="w-clip"><rect x="4" y="8" width="828" height="16" rx="4"/></clipPath><g clip-path="url(#w-clip)"><polygon class="wave" points="-48,24 -36,8 -26,8 -38,24" fill="#F4B400" opacity="0.85"/><polygon class="wave" points="-24,24 -12,8 -2,8 -14,24" fill="#F4B400" opacity="0.85"/><polygon class="wave" points="0,24 12,8 22,8 10,24" fill="#111115" opacity="0.85"/><polygon class="wave" points="24,24 36,8 46,8 34,24" fill="#E63946" opacity="0.85"/><polygon class="wave" points="48,24 60,8 70,8 58,24" fill="#F4B400" opacity="0.85"/><polygon class="wave" points="72,24 84,8 94,8 82,24" fill="#111115" opacity="0.85"/><polygon class="wave" points="96,24 108,8 118,8 106,24" fill="#E63946" opacity="0.85"/><polygon class="wave" points="120,24 132,8 142,8 130,24" fill="#F4B400" opacity="0.85"/><polygon class="wave" points="144,24 156,8 166,8 154,24" fill="#111115" opacity="0.85"/><polygon class="wave" points="168,24 180,8 190,8 178,24" fill="#E63946" opacity="0.85"/><polygon class="wave" points="192,24 204,8 214,8 202,24" fill="#F4B400" opacity="0.85"/><polygon class="wave" points="216,24 228,8 238,8 226,24" fill="#111115" opacity="0.85"/><polygon class="wave" points="240,24 252,8 262,8 250,24" fill="#E63946" opacity="0.85"/><polygon class="wave" points="264,24 276,8 286,8 274,24" fill="#F4B400" opacity="0.85"/><polygon class="wave" points="288,24 300,8 310,8 298,24" fill="#111115" opacity="0.85"/><polygon class="wave" points="312,24 324,8 334,8 322,24" fill="#E63946" opacity="0.85"/><polygon class="wave" points="336,24 348,8 358,8 346,24" fill="#F4B400" opacity="0.85"/><polygon class="wave" points="360,24 372,8 382,8 370,24" fill="#111115" opacity="0.85"/><polygon class="wave" points="384,24 396,8 406,8 394,24" fill="#E63