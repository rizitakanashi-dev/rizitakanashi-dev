<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="67.28" height="74" viewBox="0 0 67.28 74" role="img" aria-label=""><title></title><style>text{font-family:G,'Google Sans','Segoe UI',Roboto,sans-serif;font-variation-settings:'ROND' 100}
.up{animation:up .75s cubic-bezier(.16,1,.3,1) both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
.fade{animation:fade .8s ease both}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 6s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,0,0,1) both}
.wave{animation:wave 3s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-48px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="ext-social-r" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="-5" dy="-5" stdDeviation="5" flood-color="#FFFFFF" flood-opacity="0.95"/><feDropShadow dx="5" dy="5" stdDeviation="6" flood-color="#C5CEDB" flood-opacity="0.65"/></filter><filter id="sm-social-r" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="-3" dy="-3" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.98"/><feDropShadow dx="3" dy="3" stdDeviation="3.5" flood-color="#C5CEDB" flood-opacity="0.6"/></filter><linearGradient id="cvx-social-r" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F7F9FC"/><stop offset="100%" stop-color="#E4E8F0"/></linearGradient><linearGradient id="well-social-r" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#CFD7E3"/><stop offset="55%" stop-color="#E2E6EE"/><stop offset="100%" stop-color="#FAFCFF"/></linearGradient><linearGradient id="well-rim-social-r" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C5CEDB" stop-opacity="0.8"/><stop offset="50%" stop-color="#ECEFF4" stop-opacity="0"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/></linearGradient><linearGradient id="cvx-rim-social-r" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="50%" stop-color="#ECEFF4" stop-opacity="0"/><stop offset="100%" stop-color="#C5CEDB" stop-opacity="0.55"/></linearGradient><linearGradient id="acc-social-r" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E11D48"/><stop offset="100%" stop-color="#D97706"/></linearGradient></defs><rect x="-32" y="2" width="97.3" height="70" rx="22" fill="#ECEFF4"/><rect x="8.0" y="29.0" width="43.3" height="16.0" rx="8" fill="url(#well-social-r)"/><rect x="8.8" y="29.8" width="41.8" height="14.5" rx="7.25" fill="none" stroke="url(#well-rim-social-r)" stroke-width="1.5"/></svg>